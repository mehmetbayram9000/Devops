name: Otomatik Canlıya Alış

on:
  push:
    branches: [ main ] # Sadece ana koda bir şey ekleyince çalışır

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuya Gizli Tünel Aç ve Güncelle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/devops
            git pull origin main
            bash deploy.sh
